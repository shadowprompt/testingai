<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}AI政策文本测评系统{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"><script defer src="{{url_for('static',filename='app.js')}}"></script></head><body><div class="layout"><aside class="sidebar"><a class="brand" href="{{url_for('index')}}"><div class="mark">政</div><div><b>AI政策文本测评系统</b><span>政策文本评价与审校</span></div></a><nav><a href="{{url_for('index')}}">测评工作台</a><a href="{{url_for('method')}}">评价方法</a><a href="{{url_for('help_page')}}">使用说明</a></nav><div class="side-note">自动评价用于辅助筛查和横向比较，重要政策事实仍需人工核验。</div></aside><main><header class="topbar"><span>政策文本评价</span><a href="{{url_for('index')}}">新建测评</a></header><div class="content">{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></main></div></body></html>
