services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app_data:/data
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  app_data:
